name: DontCallWaleed
options:
  bundleIdPrefix: com.ahmedpremium
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "0.3.3"
    CURRENT_PROJECT_VERSION: "6"
targets:
  DontCallWaleed:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Validate house routes
        script: |
          set -e
          cp AppIcon.png Resources/Assets.xcassets/AppIcon.appiconset/icon.png
          xcrun --sdk macosx swiftc -sdk "$(xcrun --sdk macosx --show-sdk-path)" House.swift main.swift -o "$TEMP_DIR/house-check"
          "$TEMP_DIR/house-check"
        basedOnDependencyAnalysis: false
    sources:
      - path: AppNameApp.swift
      - path: ContentView.swift
      - path: House.swift
      - path: GameController.swift
      - path: IntroPhoneView.swift
      - path: Resources
      - path: Artwork-Credit.txt
      - path: blackout.wav
      - path: pipe-knock.wav
      - path: pipe-hiss.wav
      - path: scare-burp.wav
      - path: burp1.wav
      - path: burp2.wav
      - path: burp3.wav
      - path: drone.wav
      - path: Font-Credit.txt
      - path: fridge.wav
      - path: heartbeat.wav
      - path: pickup.wav
      - path: ring.wav
      - path: step.wav
      - path: sting.wav
      - path: TitleArtwork-Empty.png
      - path: VCR_OSD_MONO_1.001.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedpremium.dontcallwaleed
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Don't Call Waleed"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UIStatusBarHidden: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  DontCallWaleedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HouseTests.swift
    dependencies:
      - target: DontCallWaleed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedpremium.dontcallwaleed.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  DontCallWaleed:
    build:
      targets:
        DontCallWaleed: all
    test:
      config: Debug
      targets:
        - DontCallWaleedTests
    archive:
      config: Release
