name: Unit Tests (Simulator)

# Runs the unit tests on an iOS Simulator, including on the IPA update branch.
# Reads the scheme name from project.yml's `name:` field.

on:
  push:
    branches: [gameplay-ipa-update]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve app name
        id: app
        run: |
          set -euo pipefail
          NAME=$(awk -F':' '/^name:/{gsub(/["[:space:]]/,"",$2); print $2; exit}' project.yml)
          if [ -z "$NAME" ]; then echo "::error::Could not read 'name:' from project.yml"; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          groups = json.load(sys.stdin)["devices"]
          devices = [device for runtime, catalog in sorted(groups.items(), reverse=True)
                     if ".iOS-" in runtime for device in catalog if device.get("isAvailable")]
          match = next((item for item in devices if item["name"].startswith("iPad")), None)
          if match is None:
              match = next(item for item in devices if item["name"].startswith("iPhone"))
          print(match["udid"])
          ')
          echo "id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          SCHEME: ${{ steps.app.outputs.name }}
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "${SCHEME}.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO
